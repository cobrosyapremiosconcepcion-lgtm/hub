<script>
    // PEGA AQUÍ TU URL DE GOOGLE SHEETS (OPCIÓN CSV)
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR6z-7_v-59-9-9-9-9-9-9/pub?output=csv'; 
    // Nota: Sustituye la URL de arriba por la que obtengas al "Publicar como CSV"

    async function cargarLinks() {
      const loader = document.getElementById('loader');
      const grid = document.getElementById('links-grid');
      
      // Intentar con proxy CORS, luego directo
      const proxies = [
        `https://corsproxy.io/?url=${encodeURIComponent(SHEET_CSV_URL)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(SHEET_CSV_URL)}`,
        SHEET_CSV_URL
      ];

      let data = null;

      for (const url of proxies) {
        try {
          const response = await fetch(url);
          if (!response.ok) continue;
          data = await response.text();
          if (data && data.length > 10) break; // Si descargó datos correctamente, salimos del bucle
        } catch (error) {
          console.warn('Fallo al conectar, intentando siguiente ruta...', url);
        }
      }

      if (!data) {
        loader.innerHTML = "Error al sincronizar con Google Sheets. Verifica la publicación del archivo.";
        return;
      }

      // Procesar los datos si la descarga fue exitosa
      const filas = data.split('\n').slice(1); // Omitimos la cabecera
      let htmlContent = '';

      filas.forEach(fila => {
        // Expresión regular para separar por comas ignorando comas dentro de comillas
        const columnas = fila.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || fila.split(',');
        
        if (columnas.length >= 3) {
          // Limpiamos comillas extra si las hubiera
          const orden   = columnas[0].replace(/(^"|"$)/g, '').trim();
          const url     = columnas[1].replace(/(^"|"$)/g, '').trim();
          const detalle = columnas[2].replace(/(^"|"$)/g, '').trim();

          if (url && detalle) {
            htmlContent += `
              <a href="${url}" class="card" target="_blank">
                <div class="icon-circle">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                </div>
                <h2>${detalle}</h2>
                <p>Acceder a la plataforma</p>
              </a>
            `;
          }
        }
      });

      loader.style.display = 'none';
      grid.innerHTML = htmlContent;
    }

    // Carga inicial
    cargarLinks();

    // Sincronización automática cada 10 minutos
    setInterval(cargarLinks, 10 * 60 * 1000);
  </script>
